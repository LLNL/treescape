[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "treescape"
version = "2026.1.0"
description = "Jupyter-based visualization tool for performance data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[tool.poetry]
name = "treescape"
version = "2026.1.0"
description = "Jupyter-based visualization for performance data."
license = "MIT"
include = [
    { path = "treescape/static/stacked.css", format = ["sdist", "wheel"] },
    { path = "treescape/static/*.js", format = ["sdist", "wheel"] }
]

[tool.ruff]
line-length = 88
target-version = 'py311'
include = ['\.pyi?$']
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
